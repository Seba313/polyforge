name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: godot
    attributes:
      label: Godot version
      placeholder: 4.7.2.stable
    validations:
      required: true
  - type: input
    id: polyforge
    attributes:
      label: Polyforge version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 / macOS 15 / Fedora 43…
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you select, which keys did you press?
      placeholder: |
        1. Add a Cube (Polyforge → Add Mesh)
        2. Tab, 3, select the top face
        3. E, move the mouse, click
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What happened, and what did you expect (e.g. Blender's behaviour)?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Errors from the Output panel (if any)
      render: text
